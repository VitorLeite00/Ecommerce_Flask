{% extends 'base.html' %}
{% block title %}Editar Usuário{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Editar Usuário</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" value="{{ usuario.nome }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ usuario.email }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Nova senha (deixe em branco para manter a atual)</label>
            <input type="password" class="form-control" name="senha">
          </div>
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('usuarios.listar') }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
