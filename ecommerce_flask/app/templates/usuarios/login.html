{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Entrar</h1>
<form method="post">
  <label>Email</label>
  <input type="email" name="email" required>
  <label>Senha</label>
  <input type="password" name="senha" required>
  <button type="submit">Entrar</button>
</form>
<p>Ainda não tem conta? <a href="{{ url_for('usuarios.cadastro') }}">Cadastre-se</a></p>
{% endblock %}
