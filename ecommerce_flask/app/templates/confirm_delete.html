{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger shadow-sm">
      <div class="card-header bg-danger text-white">{{ titulo }}</div>
      <div class="card-body">
        <p>{{ mensagem }}</p>
        <p class="fw-bold">Esta ação não pode ser desfeita.</p>
        <form method="post">
          <button type="submit" class="btn btn-danger">Sim, excluir</button>
          <a class="btn btn-outline-secondary" href="{{ voltar_url }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
