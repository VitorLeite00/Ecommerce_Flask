{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1>{{ titulo }}</h1>
<div class="box">
  <p>{{ mensagem }}</p>
  <p><strong>Esta ação não pode ser desfeita.</strong></p>
  <form method="post">
    <button type="submit" class="btn-danger">Sim, excluir</button>
    <a class="btn btn-secondary" href="{{ voltar_url }}">Cancelar</a>
  </form>
</div>
{% endblock %}
