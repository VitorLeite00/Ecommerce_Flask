{% extends 'base.html' %}
{% block title %}{{ 'Editar Anúncio' if anuncio else 'Novo Anúncio' }}{% endblock %}
{% block content %}
<h1>{{ 'Editar Anúncio' if anuncio else 'Novo Anúncio' }}</h1>
<form method="post">
  <label>Título</label>
  <input type="text" name="titulo" value="{{ anuncio.titulo if anuncio else '' }}" required>
  <label>Descrição</label>
  <textarea name="descricao" required>{{ anuncio.descricao if anuncio else '' }}</textarea>
  <label>Preço (R$)</label>
  <input type="number" step="0.01" name="preco" value="{{ anuncio.preco if anuncio else '' }}" required>
  <label>Categoria</label>
  <select name="id_categoria" required>
    {% for c in categorias %}
    <option value="{{ c.id }}" {% if anuncio and anuncio.id_categoria == c.id %}selected{% endif %}>{{ c.nome }}</option>
    {% endfor %}
  </select>
  <button type="submit">Salvar</button>
</form>
{% endblock %}
