{% extends 'base.html' %}
{% block title %}{{ 'Editar Anúncio' if anuncio else 'Novo Anúncio' }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h1 class="h3 mb-3">{{ 'Editar Anúncio' if anuncio else 'Novo Anúncio' }}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" name="titulo" value="{{ anuncio.titulo if anuncio else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" name="descricao" rows="4" required>{{ anuncio.descricao if anuncio else '' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Preço (R$)</label>
            <input type="number" step="0.01" class="form-control" name="preco" value="{{ anuncio.preco if anuncio else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Categoria</label>
            <select class="form-select" name="id_categoria" required>
              {% for c in categorias %}
              <option value="{{ c.id }}" {% if anuncio and anuncio.id_categoria == c.id %}selected{% endif %}>{{ c.nome }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('anuncios.meus_anuncios') }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
