{% extends 'base.html' %}
{% block title %}{{ 'Editar Lista' if lista else 'Nova Lista' }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">{{ 'Editar Lista de Favoritos' if lista else 'Nova Lista de Favoritos' }}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nome da lista</label>
            <input type="text" class="form-control" name="nome_lista" value="{{ lista.nome_lista if lista else '' }}" required>
          </div>
          <button type="submit" class="btn btn-primary">{{ 'Salvar' if lista else 'Criar' }}</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('favoritos.minhas_listas') }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
