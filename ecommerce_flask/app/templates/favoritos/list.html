{% extends 'base.html' %}
{% block title %}Meus Favoritos{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Minhas Listas de Favoritos</h1>
  <a class="btn btn-primary" href="{{ url_for('favoritos.nova_lista') }}">+ Nova Lista</a>
</div>
<div class="list-group">
  {% for l in listas %}
  <div class="list-group-item d-flex justify-content-between align-items-center">
    <a class="text-decoration-none" href="{{ url_for('favoritos.detalhe', id_lista=l.id) }}">{{ l.nome_lista }}</a>
    <span>
      <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('favoritos.editar', id_lista=l.id) }}">Editar</a>
      <a class="btn btn-sm btn-outline-danger" href="{{ url_for('favoritos.excluir', id_lista=l.id) }}">Excluir</a>
    </span>
  </div>
  {% else %}
  <div class="list-group-item text-muted">Você ainda não criou nenhuma lista de favoritos.</div>
  {% endfor %}
</div>
{% endblock %}
