{% extends 'base.html' %}
{% block title %}Categorias{% endblock %}
{% block content %}
<h1>Categorias</h1>
<div class="grid">
  {% for c in categorias %}
  <div class="card">
    <h3><a href="{{ url_for('categorias.anuncios_da_categoria', id_categoria=c.id) }}">{{ c.nome }}</a></h3>
    <p>{{ c.descricao }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
