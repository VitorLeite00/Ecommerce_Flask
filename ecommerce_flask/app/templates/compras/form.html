{% extends 'base.html' %}
{% block title %}Editar Compra{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h3 mb-3">Editar Compra</h1>
    <p class="text-muted mb-1"><strong>Anúncio:</strong> {{ compra.anuncio.titulo }}</p>
    <p class="text-muted"><strong>Comprador:</strong> {{ compra.comprador.nome }}</p>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Valor pago (R$)</label>
            <input type="number" step="0.01" class="form-control" name="valor_pago" value="{{ compra.valor_pago }}" required>
          </div>
          <button type="submit" class="btn btn-primary">Salvar</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('compras.listar') }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
